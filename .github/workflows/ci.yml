name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pack and pinned core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Inf core
        run: ./inf-core/gradlew -p inf-core build --no-daemon

      - name: Build and test Inf Expedition
        run: ./gradlew test build --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pack tooling dependencies
        run: python -m pip install Pillow PyYAML

      - name: Test pack tooling
        run: |
          python tools/test_gen_rooms.py
          python tools/test_pack_assets.py
          python tools/test_build_pack.py
          python tools/test_build_mrpack.py
          python tools/gen_rooms.py --check
          python tools/build_pack.py --check
